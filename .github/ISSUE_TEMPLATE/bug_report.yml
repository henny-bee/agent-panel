name: Bug report
description: Report a problem in MCode
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        MCode builds on Windows, macOS and Linux. Problems that also happen in the original Monocode belong at https://github.com/hardbeat920/monocode/issues.

  - type: input
    id: version
    attributes:
      label: MCode commit
      placeholder: "9bc68191"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "Windows 11, Ubuntu 24.04, macOS 15.5"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider CLI
      options:
        - Claude Code
        - Codex
        - Cursor
        - Grok Build
        - OpenCode
        - Pi
        - omp
        - fx
        - Antigravity
        - Hermes Agent
        - Devin
        - Multiple / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
